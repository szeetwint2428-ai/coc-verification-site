<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC COC Verification</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      padding: 42px 55px;
      box-sizing: border-box;
    }

    .logo {
      display: block;
      width: 150px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 30px;
      color: #111827;
    }

    .notice-box {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      background: #f3f6fb;
      border: 1px solid #dbe3ee;
      border-left: 6px solid #1f2937;
      padding: 18px 22px;
      border-radius: 12px;
      margin-bottom: 35px;
    }

    .notice-icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: #e5eaf2;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-top: 3px;
    }

    .notice-text {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 700;
      color: #111827;
    }

    .top-info {
      margin-bottom: 34px;
      font-size: 18px;
      line-height: 1.45;
      color: #111827;
    }

    .top-info-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      column-gap: 8px;
    }

    .pdf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 18px;
      color: #111827;
    }

    .pdf-table td {
      padding: 13px 0;
      vertical-align: top;
    }

    .pdf-label {
      width: 260px;
      font-weight: 400;
      white-space: nowrap;
      padding-right: 25px;
    }

    .pdf-value {
      font-weight: 400;
      word-break: break-word;
    }

    .invalid-header {
      text-align: center;
      color: #b91c1c;
      font-size: 30px;
      font-weight: 700;
      margin-top: 20px;
    }

    .message {
      text-align: center;
      font-size: 18px;
      color: #4b5563;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      font-size: 22px;
      color: #4b5563;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 24px;
      }

      .logo {
        width: 120px;
      }

      h1 {
        font-size: 24px;
      }

      .notice-box {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 18px;
      }

      .notice-text {
        font-size: 15px;
      }

      .top-info {
        font-size: 16px;
      }

      .top-info-row {
        grid-template-columns: 105px 1fr;
      }

      .pdf-table {
        font-size: 16px;
      }

      .pdf-table tr {
        display: block;
        padding: 10px 0;
      }

      .pdf-table td {
        display: block;
        padding: 3px 0;
      }

      .pdf-label {
        width: auto;
        font-weight: 700;
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="logo.jpeg" alt="ATC Logo" class="logo">

    <h1>Certificate of Conformity Verification</h1>

    <div id="result" class="loading">Verifying...</div>

    <div class="footer">
      Verified by ATC Surface Finishing
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const resultDiv = document.getElementById("result");

    function clean(value) {
      return value && String(value).trim() !== "" ? value : "-";
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }).replace(/ /g, "-");
    }

    function tableRow(label, value) {
      return `
        <tr>
          <td class="pdf-label">${label}</td>
          <td class="pdf-value">${clean(value)}</td>
        </tr>
      `;
    }

    if (!token) {
      resultDiv.innerHTML = `
        <div class="invalid-header">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Invalid QR Code
        </div>
        <div class="message">The QR code is missing required verification information.</div>
      `;
    } else {
      fetch(`https://coc-verification-api-arf5hbb7dhesfgd2.malaysiawest-01.azurewebsites.net/api/verify?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (data.result === "Valid") {
            resultDiv.className = "";

            resultDiv.innerHTML = `
              <div class="notice-box">
                <div class="notice-icon">
                  <i class="fa-solid fa-database"></i>
                </div>

                <div class="notice-text">
                  The data below is retrieved from ATC Surface Finishing’s official database.<br>
                  Please ensure all details match your certificate copy.<br>
                  Matching information confirms validity; any discrepancy may indicate an invalid or fraudulent certificate.
                </div>
              </div>

              <div class="top-info">
                <div class="top-info-row">
                  <div>COC No. :</div>
                  <div>${clean(data.cocNo)}</div>
                </div>
                <div class="top-info-row">
                  <div>COC Date :</div>
                  <div>${formatDate(data.cocDate)}</div>
                </div>
              </div>

              <table class="pdf-table">
                <tbody>
                  ${tableRow("Customer", data.customer)}
                  ${tableRow("Customer Part Number", data.customerPartNumber)}
                  ${tableRow("Customer Part Revision", data.customerPartRevision)}
                  ${data.description ? tableRow("Description", data.description) : ""}
                  ${tableRow("Quantity", data.quantity)}
                  ${data.remark ? tableRow("Remarks", data.remark) : ""}
                  ${tableRow("Specification", data.specification)}
                </tbody>
              </table>
            `;
          } else {
            resultDiv.innerHTML = `
              <div class="invalid-header">
                <i class="fa-solid fa-circle-xmark"></i>
                Certificate NOT VERIFIED
              </div>
              <div class="message">The certificate may be invalid, revoked, expired, or tampered.</div>
            `;
          }
        })
        .catch((err) => {
          console.error(err);
          resultDiv.innerHTML = `
            <div class="invalid-header">
              <i class="fa-solid fa-wifi"></i>
              Service Unavailable
            </div>
            <div class="message">Please try again later.</div>
          `;
        });
    }
  </script>
</body>
</html>
