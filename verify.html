<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC COC Verification</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 780px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      padding: 42px 55px;
      box-sizing: border-box;
    }

    .logo {
      display: block;
      width: 150px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 0 0 34px;
      color: #111827;
    }

    .valid-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 38px;
      color: #147a24;
      font-size: 32px;
      font-weight: 700;
    }

    .check-circle {
      width: 76px;
      height: 76px;
      border: 6px solid #147a24;
      border-radius: 50%;
      background: #e8f5e9;
      color: #147a24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      flex-shrink: 0;
    }

    .details {
      margin-top: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 70px 170px 1fr;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding: 22px 0;
      column-gap: 18px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .icon {
      font-size: 28px;
      color: #0f4f3f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 23px;
      font-weight: 700;
      color: #111827;
    }

    .value {
      font-size: 23px;
      color: #111827;
      word-break: break-word;
    }

    .status-valid {
      color: #147a24;
      font-weight: 600;
    }

    .invalid-header {
      text-align: center;
      color: #b91c1c;
      font-size: 30px;
      font-weight: 700;
      margin-top: 20px;
    }

    .message {
      text-align: center;
      font-size: 18px;
      color: #4b5563;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      font-size: 22px;
      color: #4b5563;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 24px;
      }

      .logo {
        width: 120px;
      }

      h1 {
        font-size: 25px;
      }

      .valid-header {
        flex-direction: column;
        font-size: 25px;
        gap: 14px;
      }

      .check-circle {
        width: 62px;
        height: 62px;
        font-size: 34px;
      }

      .row {
        grid-template-columns: 45px 1fr;
        row-gap: 6px;
      }

      .icon {
        font-size: 23px;
      }

      .label {
        font-size: 18px;
      }

      .value {
        grid-column: 2 / 3;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="logo.jpeg" alt="ATC Logo" class="logo">

    <h1>Certificate Verification</h1>

    <div id="result" class="loading">Verifying...</div>

    <div class="footer">
      Verified by ATC Surface Finishing
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const resultDiv = document.getElementById("result");

    if (!token) {
      resultDiv.innerHTML = `
        <div class="invalid-header">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Invalid QR Code
        </div>
        <div class="message">The QR code is missing required verification information.</div>
      `;
    } else {
      fetch(`https://coc-verification-api-arf5hbb7dhesfgd2.malaysiawest-01.azurewebsites.net/api/verify?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (data.result === "Valid") {
            resultDiv.className = "";

            resultDiv.innerHTML = `
              <div class="valid-header">
                <div class="check-circle">
                  <i class="fa-solid fa-check"></i>
                </div>
                <div>Certificate is VALID</div>
              </div>

              <div class="details">
                <div class="row">
                  <div class="icon"><i class="fa-solid fa-id-card"></i></div>
                  <div class="label">COC ID:</div>
                  <div class="value">${data.cocId || "-"}</div>
                </div>

                <div class="row">
                  <div class="icon"><i class="fa-solid fa-building"></i></div>
                  <div class="label">Customer:</div>
                  <div class="value">${data.customer || "-"}</div>
                </div>

                <div class="row">
                  <div class="icon"><i class="fa-solid fa-file-lines"></i></div>
                  <div class="label">Details:</div>
                  <div class="value">${data.details || "-"}</div>
                </div>

                <div class="row">
                  <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
                  <div class="label">Status:</div>
                  <div class="value status-valid">${data.status || "-"}</div>
                </div>
              </div>
            `;
          } else {
            resultDiv.innerHTML = `
              <div class="invalid-header">
                <i class="fa-solid fa-circle-xmark"></i>
                Certificate NOT VERIFIED
              </div>
              <div class="message">The certificate may be invalid, revoked, expired, or tampered.</div>
            `;
          }
        })
        .catch((err) => {
          console.error(err);
          resultDiv.innerHTML = `
            <div class="invalid-header">
              <i class="fa-solid fa-wifi"></i>
              Service Unavailable
            </div>
            <div class="message">Please try again later.</div>
          `;
        });
    }
  </script>
</body>
</html>
