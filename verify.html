<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC COC Verification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 1080px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      padding: 26px 38px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .logo {
      width: 72px;
      flex-shrink: 0;
    }

    h1 {
      flex: 1;
      text-align: center;
      font-size: 22px;
      margin: 0;
      color: #111827;
    }

    .header-spacer {
      width: 72px;
    }

    .notice-box {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f3f6fb;
      border: 1px solid #dbe3ee;
      border-left: 5px solid #1f2937;
      padding: 11px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .notice-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      background: #e5eaf2;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .notice-text {
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
      color: #111827;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 28px;
    }

    .row {
      display: grid;
      grid-template-columns: 30px 150px 1fr;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding: 9px 0;
      column-gap: 10px;
    }

    .details .row:nth-last-child(-n+2) {
      border-bottom: none;
    }

    .icon {
      font-size: 16px;
      color: #0f4f3f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 13.5px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }

    .value {
      font-size: 13.5px;
      color: #111827;
      word-break: break-word;
    }

    .invalid-header {
      text-align: center;
      color: #b91c1c;
      font-size: 26px;
      font-weight: 700;
      margin-top: 20px;
    }

    .message {
      text-align: center;
      font-size: 16px;
      color: #4b5563;
      margin-top: 14px;
    }

    .loading {
      text-align: center;
      font-size: 20px;
      color: #4b5563;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    /* Mobile: 2-col compact stacked layout */
    @media (max-width: 700px) {
      body {
        align-items: flex-start;
        padding: 14px;
      }

      .card {
        padding: 18px 16px;
        border-radius: 14px;
      }

      .header {
        gap: 10px;
        margin-bottom: 12px;
      }

      .logo {
        width: 52px;
      }

      .header-spacer {
        width: 52px;
      }

      h1 {
        font-size: 15px;
      }

      .notice-box {
        padding: 9px 12px;
        gap: 10px;
        margin-bottom: 12px;
      }

      .notice-icon {
        width: 30px;
        height: 30px;
        min-width: 30px;
        font-size: 13px;
      }

      .notice-text {
        font-size: 11px;
      }

      .details {
        grid-template-columns: 1fr 1fr;
        column-gap: 10px;
      }

      .row {
        grid-template-columns: 20px 1fr;
        grid-template-rows: auto auto;
        padding: 7px 0;
        column-gap: 6px;
        align-items: start;
      }

      .details .row:nth-last-child(-n+2) {
        border-bottom: none;
      }

      .icon {
        grid-column: 1;
        grid-row: 1 / 3;
        align-self: center;
        font-size: 13px;
      }

      .label {
        grid-column: 2;
        grid-row: 1;
        font-size: 10px;
        color: #6b7280;
        font-weight: 600;
        white-space: normal;
        line-height: 1.2;
      }

      .value {
        grid-column: 2;
        grid-row: 2;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
      }

      .footer {
        font-size: 11px;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <img src="logo.jpeg" alt="ATC Logo" class="logo">
      <h1>Certificate of Conformity Verification</h1>
      <div class="header-spacer"></div>
    </div>

    <div id="result" class="loading">Verifying...</div>

    <div class="footer">
      The data above is retrieved from official database of ATC Surface Finishing.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const resultDiv = document.getElementById("result");

    function row(icon, label, value) {
      return `
        <div class="row">
          <div class="icon"><i class="${icon}"></i></div>
          <div class="label">${label}:</div>
          <div class="value">${value || "-"}</div>
        </div>
      `;
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (isNaN(date.getTime())) return value;
      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    if (!token) {
      resultDiv.innerHTML = `
        <div class="invalid-header">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Invalid QR Code
        </div>
        <div class="message">The QR code is missing required verification information.</div>
      `;
    } else {
      fetch(`https://coc-verification-api-arf5hbb7dhesfgd2.malaysiawest-01.azurewebsites.net/api/verify?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (data.result === "Valid") {
            resultDiv.className = "";
            resultDiv.innerHTML = `
              <div class="notice-box">
                <div class="notice-icon">
                  <i class="fa-solid fa-database"></i>
                </div>
                <div class="notice-text">
                  Please ensure all details match your certificate copy.<br>
                  Matching information confirms validity; any discrepancy may indicate an invalid or fraudulent certificate.
                </div>
              </div>
              <div class="details">
                ${row("fa-solid fa-truck", "DO No.", data.doNo || "-")}
                ${row("fa-solid fa-calendar-check", "Date of DO", formatDate(data.doDate))}
                ${row("fa-solid fa-certificate", "COC No.", data.cocNo)}
                ${row("fa-solid fa-calendar-days", "COC Date", formatDate(data.cocDate))}
                ${row("fa-solid fa-file-invoice", "Cust PO No.", data.custPoNo || "-")}
                ${row("fa-solid fa-tag", "Cust Ref 2", data.custRef2 || "-")}
                ${row("fa-solid fa-tag", "Cust Ref 3", data.custRef3 || "-")}
                ${row("fa-solid fa-building", "Customer", data.customer)}
                ${row("fa-solid fa-barcode", "Customer Part No.", data.customerPartNumber)}
                ${row("fa-solid fa-code-branch", "Customer Part Rev.", data.customerPartRevision)}
                ${row("fa-solid fa-file-lines", "Description", data.description || "-")}
                ${row("fa-solid fa-cubes", "Quantity", data.quantity)}
                ${row("fa-solid fa-comment-dots", "Remarks", data.remark || "-")}
                ${row("fa-solid fa-clipboard-check", "Specification", data.specification)}
              </div>
            `;
          } else {
            resultDiv.innerHTML = `
              <div class="invalid-header">
                <i class="fa-solid fa-circle-xmark"></i>
                Certificate NOT VERIFIED
              </div>
              <div class="message">The certificate may be invalid, revoked, expired, or tampered.</div>
            `;
          }
        })
        .catch((err) => {
          console.error(err);
          resultDiv.innerHTML = `
            <div class="invalid-header">
              <i class="fa-solid fa-wifi"></i>
              Service Unavailable
            </div>
            <div class="message">Please try again later.</div>
          `;
        });
    }
  </script>
</body>
</html>
