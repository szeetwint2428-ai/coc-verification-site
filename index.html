<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATC COC Verification</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 820px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      padding: 42px 55px;
      box-sizing: border-box;
    }

    .logo {
      display: block;
      width: 150px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 0 0 34px;
      color: #111827;
    }

    .valid-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 38px;
      color: #147a24;
      font-size: 32px;
      font-weight: 700;
    }

    .check-circle {
      width: 50px;
      height: 50px;
      border: 6px solid #1f2937;
      border-radius: 50%;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      flex-shrink: 0;
    }

    .details {
      margin-top: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 70px 230px 1fr;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 0;
      column-gap: 18px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .icon {
      font-size: 27px;
      color: #0f4f3f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 21px;
      font-weight: 700;
      color: #111827;
    }

    .value {
      font-size: 21px;
      color: #111827;
      word-break: break-word;
    }

    .invalid-header {
      text-align: left;
      color: #b91c1c;
      font-size: 30px;
      font-weight: 700;
      margin-top: 20px;
    }

    .message {
      text-align: center;
      font-size: 18px;
      color: #4b5563;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      font-size: 22px;
      color: #4b5563;
    }

    .footer {
      margin-top: 30px;
      text-align: justify;
      font-size: 20px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 24px;
      }

      .logo {
        width: 120px;
      }

      h1 {
        font-size: 25px;
      }

      .valid-header {
        flex-direction: column;
        font-size: 25px;
        gap: 14px;
      }

      .check-circle {
        width: 40px;
        height: 40px;
        font-size: 25px;
      }

      .row {
        grid-template-columns: 45px 1fr;
        row-gap: 6px;
      }

      .icon {
        font-size: 23px;
      }

      .label {
        font-size: 18px;
      }

      .value {
        grid-column: 2 / 3;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="logo.jpeg" alt="ATC Logo" class="logo">

    <h1>Certificate of Conformity Verification</h1>

    <div id="result" class="loading">Verifying...</div>

    <div class="footer">
      The data below is retrieved from official database of ATC Surface Finishing.<br>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const resultDiv = document.getElementById("result");

    function row(icon, label, value) {
      return `
        <div class="row">
          <div class="icon"><i class="${icon}"></i></div>
          <div class="label">${label}:</div>
          <div class="value">${value || "-"}</div>
        </div>
      `;
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    if (!token) {
      resultDiv.innerHTML = `
        <div class="invalid-header">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Invalid QR Code
        </div>
        <div class="message">The QR code is missing required verification information.</div>
      `;
    } else {
      fetch(`https://coc-verification-api-arf5hbb7dhesfgd2.malaysiawest-01.azurewebsites.net/api/verify?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (data.result === "Valid") {
            resultDiv.className = "";

            resultDiv.innerHTML = `
              <div class="valid-header">
                <div class="check-circle">
                  <i class="fa-solid fa-database"></i>
                </div>
              
                <div style="text-align:center; font-size:20px; line-height:1.5;">
                  Please ensure all details match your certificate copy.<br>
                  Matching information confirms validity; any discrepancy may indicate an invalid or fraudulent certificate.
                </div>
              </div>
              
              <div class="details">
                ${row("fa-solid fa-certificate", "COC No.", data.cocNo)}
                ${row("fa-solid fa-calendar-days", "COC Date", formatDate(data.cocDate))}
                ${row("fa-solid fa-building", "Customer", data.customer)}
                ${row("fa-solid fa-barcode", "Customer Part Number", data.customerPartNumber)}
                ${row("fa-solid fa-code-branch", "Customer Part Revision", data.customerPartRevision)}

                ${data.description ? row("fa-solid fa-file-lines", "Description", data.description) : ""}

                ${row("fa-solid fa-cubes", "Quantity", data.quantity)}

                ${data.remark ? row("fa-solid fa-comment-dots", "Remark", data.remark) : ""}

                ${row("fa-solid fa-clipboard-check", "Specification", data.specification)}
              </div>
            `;
          } else {
            resultDiv.innerHTML = `
              <div class="invalid-header">
                <i class="fa-solid fa-circle-xmark"></i>
                Certificate NOT VERIFIED
              </div>
              <div class="message">The certificate may be invalid, revoked, expired, or tampered.</div>
            `;
          }
        })
        .catch((err) => {
          console.error(err);
          resultDiv.innerHTML = `
            <div class="invalid-header">
              <i class="fa-solid fa-wifi"></i>
              Service Unavailable
            </div>
            <div class="message">Please try again later.</div>
          `;
        });
    }
  </script>
</body>
</html>
